
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">

    <title>Restablecer contraseña | Control de Gastos</title>

    <!-- CSS compartido -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Icono -->
        <div class="icon icon-reset">🔒</div>

        <!-- Título -->
        <h1>Restablecer contraseña</h1>

        <p>
            Introduce tu nueva contraseña para recuperar
            el acceso a tu cuenta de Control de Gastos.
        </p>

        <!-- Formulario de recuperación -->
        <form id="resetForm" class="hidden">

            <div class="form-group">

                <label for="password">
                    Nueva contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Introduce tu nueva contraseña"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirmar nueva contraseña
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Repite tu nueva contraseña"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>

            <button type="submit" id="resetButton">
                Cambiar contraseña
            </button>

        </form>

        <!-- Mensajes de estado -->
        <div id="message" class="message"></div>

        <!-- Marca -->
        <div class="brand">
            CONTROL DE GASTOS
        </div>

    </main>

    <!-- Biblioteca oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Código JavaScript de recuperación -->
    <script src="js/reset-password.js"></script>

</body>

</html>
