
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Correo verificado | Control de Gastos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 42px 30px;
      text-align: center;
      background: #1c293a;
      border: 1px solid #344256;
      border-radius: 20px;
    }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #123e32;
      color: #42d6a0;
      font-size: 42px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 27px;
    }

    p {
      color: #c1ccda;
      line-height: 1.6;
      font-size: 16px;
    }

    .brand {
      margin-top: 30px;
      color: #42d6a0;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon">✓</div>

    <h1>¡Correo verificado!</h1>

    <p>
      Tu dirección de correo electrónico se ha
      confirmado correctamente.
    </p>

    <p>
      Tu cuenta ya está activa. Puedes volver a
      Control de Gastos e iniciar sesión.
    </p>

    <div class="brand">CONTROL DE GASTOS</div>
  </main>
</body>
</html>
